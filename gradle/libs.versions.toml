[versions]
# AGP 8.13.2 with Gradle 8.14.3, and the AndroidX line that pairs with it.
#
# AGP 9 exists, but it brings its own Kotlin support that KSP — and therefore Room's
# compiler — does not yet work with, and disabling that puts the Kotlin plugin back
# against a DSL it cannot cast. The AndroidX releases that require AGP 9 are pinned back
# to their last AGP 8 versions to match; lint will say so on every build, and it is right
# to, but a build that works is worth more than a version number that is current.
agp = "8.13.2"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"
# Ktor has no version here on purpose. The SDK exports `platform("io.ktor:ktor-bom")` as an
# `api` dependency, so the version it was tested against is the version this app resolves,
# and a number written here could only ever disagree with it — as this one did, sitting at
# 3.0.3 while the SDK had moved to 3.5.2. The engine module still belongs to this app,
# because the SDK deliberately leaves the engine to whoever uses it.
#
# These two are the versions Ktor drags onto the classpath, not a free choice: every
# kotlinx module below them gets lifted by conflict resolution anyway, so anything else
# written here is a dead letter. They are worth stating because the SDK only declares
# floors (1.9.0 / 1.7.3), and the unit-test classpath does not necessarily resolve the
# same graph as the app's. Check them after any SDK pin move with
# `./gradlew :app:dependencies --configuration releaseRuntimeClasspath`.
coroutines = "1.11.0"
serialization = "1.11.0"

coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
composeBom = "2025.09.00"
navigation = "2.9.5"
datastore = "1.1.7"
room = "2.8.4"
work = "2.10.5"
camerax = "1.5.0"
media3 = "1.8.0"
browser = "1.9.0"
exif = "1.4.1"
coil = "3.3.0"
zxing = "3.5.3"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

imogen-sdk = { module = "com.imogen:imogen-sdk" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
